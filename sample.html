<!doctype html>
<html lang="zh-Hant">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宣告式商品卡範例</title><link rel="stylesheet" href="/examples.css"></head>
<body><main><a href="/">← 回展示間</a><h1>宣告式 HTML 嵌入</h1><p>只載入建置後的元件，無須載入展示間或任何框架。</p>
<section class="examples" aria-label="商品範例"><momo-card product-id="example-headphones"></momo-card><momo-card product-id="example-salmon" variant="flash-sale"></momo-card></section>
<p id="sample-feedback" role="status">點選商品可觀察公開事件。</p><pre>&lt;momo-card product-id="example-headphones"&gt;&lt;/momo-card&gt;</pre></main>
<script>
(async () => {
const url='./dist/momo-cards.es.js';
const {configureCatalog}=await import(/* @vite-ignore */ url);
configureCatalog([
{schemaVersion:1,id:'example-headphones',variant:'ranking',title:'示範耳機',image:{src:'./assets/rank-bose.svg',alt:'五色耳機示意圖'},price:9500,originalPrice:9500,tagline:'宣告式範例 · 原價保留劃線'},
{schemaVersion:1,id:'example-salmon',variant:'flash-sale',title:'示範鮭魚切片 400g',image:{src:'./assets/flash-salmon.svg',alt:'鮭魚切片示意圖'},price:149,originalPrice:300,stock:188,tagline:'本地假資料 · 無真實交易'}
]);
document.addEventListener('momo-card-action',event=>{document.querySelector('#sample-feedback').textContent=`收到 ${event.detail.action}：${event.detail.id}`;});
})().catch(error => { document.querySelector("#sample-feedback").textContent = `元件載入失敗：${error.message}。請先執行 npm run build。`; });
</script></body></html>
